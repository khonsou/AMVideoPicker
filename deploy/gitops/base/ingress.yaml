apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: am-video-picker
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - video-picker.angrymiao.com
      secretName: am-tls
  rules:
    - host: video-picker.angrymiao.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: am-video-picker
                port:
                  number: 80